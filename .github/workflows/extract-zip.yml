name: Extract Zip

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path (in the repo root) to the zip file to extract'
        required: true
        default: 'OrionMD_wallpaperpicker.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repo root
        run: |
          ZIP="${{ github.event.inputs.zip_path }}"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP not found in repo root"
            exit 1
          fi
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o "$ZIP" -d /tmp/extracted

          # If the zip has a single top-level folder (e.g. OrionMD_wallpaperpicker/),
          # flatten its contents up into the repo root instead of nesting it.
          TOP_LEVEL=$(find /tmp/extracted -mindepth 1 -maxdepth 1)
          COUNT=$(echo "$TOP_LEVEL" | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "$TOP_LEVEL" ]; then
            cp -r "$TOP_LEVEL"/. .
          else
            cp -r /tmp/extracted/. .
          fi

          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract ${{ github.event.inputs.zip_path }} via workflow"
            git push
          fi
